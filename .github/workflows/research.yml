name: Research factors

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "all = S&P500+IL+crypto, il = every Tel Aviv stock"
        default: il
        type: choice
        options: [il, all]

permissions:
  contents: write

concurrency:
  group: confluence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python engine/research.py "${{ inputs.universe }}"
      - run: |
          git config user.name "confluence-bot"
          git config user.email "confluence-bot@users.noreply.github.com"
          git add state/research*.json
          git commit -m "research $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase -q
          git push
