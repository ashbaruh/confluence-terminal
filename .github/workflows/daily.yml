name: Daily scan

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC, Mon–Fri — after the US close
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: confluence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan, backtest, picks, track record
        run: python engine/main.py daily
      - name: Lock today's picks in git
        run: |
          git config user.name "confluence-bot"
          git config user.email "confluence-bot@users.noreply.github.com"
          git add state/
          git commit -m "picks $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/cache/save@v4
        with:
          path: site/data
          key: site-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
